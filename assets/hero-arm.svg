  <style>
@media (prefers-reduced-motion:no-preference) {
  .arm-joint-1 { animation:reach 8s ease-in-out infinite; }
  .arm-joint-2 { animation:elbow 8s ease-in-out infinite; }
  .gripper-left { animation:close-left 8s ease-in-out infinite; }
  .gripper-right { animation:close-right 8s ease-in-out infinite; }
}
@keyframes reach { 0%,100% { transform:rotate(0deg) } 50% { transform:rotate(-4deg) } }
@keyframes elbow { 0%,100% { transform:rotate(0deg) } 50% { transform:rotate(7deg) } }
@keyframes close-left { 0%,100% { transform:rotate(0deg) } 50% { transform:rotate(-4deg) } }
@keyframes close-right { 0%,100% { transform:rotate(0deg) } 50% { transform:rotate(4deg) } }
</style>
